[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-signed", "cookie-key-expansion"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "chrono",
    "uuid"] 
}
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
config = "0.15"
tower-http = { version = "0.6", features = ["trace"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
tracing-bunyan-formatter = "0.3"
tracing-log = "0.2"
serde-aux = "4.7.0"
unicode-segmentation = "1"
validator = "0.21.0"
resend-rs = { version = "0.32.3", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.13.4", features = ["form", "cookies"] }
rand = "0.9"
thiserror = "2.0.21"
anyhow = "1.0.104"
base64 = "0.23.1"
secrecy = { version = "0.10.3", features = ["serde"] }
sha3 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
urlencoding = "2.1"   
htmlescape = "0.3"   
hmac = { version = "0.12", features = ["reset"] }
sha2 = "0.10"
hex = "0.4"
time = "0.3"
tower-sessions = "0.14"
tower-sessions-redis-store = "0.16"


[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dev-dependencies]
claim = "0.5.0"
fake = "~2.3"
quickcheck = "0.9.2"
quickcheck_macros = "0.9.1"
wiremock = "0.6"
serde_json = "1.0.151"
linkify = "0.5"
